<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">BFN</a>
    <span class="site-tagline">Built From Nothing, Built Together</span>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <nav aria-label="BFN pages">
      <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
      <a href="{{ '/delete-account/' | relative_url }}">Delete your account</a>
      <a href="mailto:{{ site.contact_email }}">Contact: {{ site.contact_email }}</a>
    </nav>
  </footer>
</body>
</html>
